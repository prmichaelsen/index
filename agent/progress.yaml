## Risks & Mitigations

### 🔴 High Priority Risks
1. **Weaviate Collection Limits**
   - Risk: Cloud tier may limit number of collections
   - Mitigation: Plan for single-collection fallback with userId filtering
   - Status: Monitoring

2. **Breaking Changes**
   - Risk: Refactoring may break existing stdio mode
   - Mitigation: Maintain backward compatibility, extensive testing
   - Status: Planned in Phase 1

### 🟡 Medium Priority Risks
3. **OpenAI API Costs**
   - Risk: Embeddings cost may scale with users
   - Mitigation: Rate limiting, usage monitoring, caching
   - Status: Planned in Phase 2

4. **Performance at Scale**
   - Risk: Server pooling may consume too much memory
   - Mitigation: Configurable limits, idle timeout, monitoring
   - Status: Planned in Phase 5

